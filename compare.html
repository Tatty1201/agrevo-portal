<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AGREVO Design Compare</title>
<style>
  :root {
    --dark: #07100b;
    --gold: #B58A3A;
    --soft: #F4F3EC;
    --muted: rgba(244,243,236,.68);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: "Noto Sans JP", system-ui, sans-serif;
    color: var(--soft);
    background:
      radial-gradient(circle at 20% 0%, rgba(181,138,58,.18), transparent 34%),
      linear-gradient(180deg, #050806, var(--dark));
    padding: clamp(28px, 6vw, 72px);
  }
  main { max-width: 1120px; margin: 0 auto; }
  .eyebrow {
    color: var(--gold);
    font-size: .78rem;
    letter-spacing: .36em;
    font-weight: 800;
    margin-bottom: 18px;
  }
  h1 {
    font-size: clamp(2.2rem, 5vw, 4.8rem);
    line-height: 1.1;
    letter-spacing: 0;
    margin-bottom: 18px;
  }
  .lead {
    max-width: 720px;
    color: var(--muted);
    line-height: 1.9;
    margin-bottom: clamp(34px, 5vw, 64px);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }
  .card {
    overflow: hidden;
    border: 1px solid rgba(244,243,236,.14);
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(244,243,236,.10), rgba(244,243,236,.04));
    box-shadow: 0 28px 80px rgba(0,0,0,.28);
  }
  .preview {
    height: 260px;
    border-bottom: 1px solid rgba(244,243,236,.12);
    background-size: cover;
    background-position: center;
  }
  .preview--current {
    background-image:
      linear-gradient(180deg, rgba(255,255,255,.06), rgba(7,16,11,.70)),
      url("assets/hero-premium-bg-v1.png");
  }
  .preview--luxury {
    background-image:
      linear-gradient(90deg, rgba(3,7,5,.86), rgba(3,7,5,.18)),
      url("assets/hero-premium-bg-v1.png");
    filter: contrast(1.08) saturate(1.05);
  }
  .body { padding: 28px; }
  h2 { font-size: 1.4rem; margin-bottom: 10px; }
  p { color: var(--muted); line-height: 1.8; margin-bottom: 24px; }
  a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: .8em 1.4em;
    border-radius: 999px;
    color: #1a1306;
    background: linear-gradient(180deg, #C9A45A, var(--gold));
    font-weight: 800;
    text-decoration: none;
  }
  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
    .preview { height: 210px; }
  }
</style>
</head>
<body>
<main>
  <div class="eyebrow">AGREVO DESIGN COMPARE</div>
  <h1>どちらの高級感が<br />アグレボらしいか。</h1>
  <p class="lead">通常版は白余白と濃色面のバランスを重視した本線案。冒険版は黒・深緑・金のコントラストを強め、よりラグジュアリーな印象に振った比較案です。</p>
  <div class="grid">
    <section class="card">
      <div class="preview preview--current"></div>
      <div class="body">
        <h2>Current / Balanced</h2>
        <p>白余白、写真、深緑帯のバランスで上質さを作る案。親デザインとして7LPへ展開しやすい。</p>
        <a href="index.html">通常版を見る</a>
      </div>
    </section>
    <section class="card">
      <div class="preview preview--luxury"></div>
      <div class="body">
        <h2>Luxury / Bold</h2>
        <p>黒と深緑の面を増やし、金のアクセントを強めた案。より強い高級感と印象の濃さを狙う。</p>
        <a href="index-luxury.html">冒険版を見る</a>
      </div>
    </section>
  </div>
</main>
</body>
</html>
