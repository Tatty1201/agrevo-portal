<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AMSI Supplement | AGREVO Portal</title>
<meta name="description" content="Supplement page for AMSI shown in a popup window." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f4f1e8;
  --panel: rgba(255, 255, 255, 0.88);
  --panel-strong: #ffffff;
  --ink: #142017;
  --ink-soft: #5a6256;
  --forest: #10241b;
  --gold: #b58a3a;
  --shadow: 0 22px 70px rgba(16, 36, 27, 0.16);
  --font-body: "Noto Sans JP", system-ui, sans-serif;
  --font-display: "Zen Kaku Gothic New", "Noto Sans JP", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(circle at top left, rgba(181, 138, 58, 0.12), transparent 30%),
    radial-gradient(circle at bottom right, rgba(31, 77, 53, 0.1), transparent 34%),
    var(--bg);
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; }
img { display: block; max-width: 100%; }
.page {
  min-height: 100vh;
  padding: clamp(16px, 2.4vw, 32px);
}
.window {
  max-width: 1200px;
  margin: 0 auto;
  background: var(--panel);
  border: 1px solid rgba(16, 36, 27, 0.08);
  border-radius: clamp(20px, 2.2vw, 32px);
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px);
  overflow: hidden;
}
.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  padding: clamp(22px, 3vw, 36px) clamp(20px, 3vw, 36px) 0;
}
.kicker {
  font-family: var(--font-display);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 0.8rem;
}
h1 {
  font-family: var(--font-display);
  font-size: clamp(1.9rem, 3.4vw, 2.9rem);
  line-height: 1.12;
  margin: 0;
}
.lead {
  max-width: 60ch;
  margin: 0.8rem 0 0;
  color: var(--ink-soft);
  font-size: 0.98rem;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: flex-end;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  padding: 0.9em 1.2em;
  border: 1px solid transparent;
  font-family: var(--font-display);
  font-weight: 700;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); }
.btn--ghost {
  border-color: rgba(16, 36, 27, 0.16);
  background: rgba(255, 255, 255, 0.72);
}
.btn--ghost:hover {
  background: #fff;
  box-shadow: 0 12px 24px rgba(16, 36, 27, 0.1);
}
.btn--dark {
  background: var(--forest);
  color: #fff;
  box-shadow: 0 12px 24px rgba(16, 36, 27, 0.18);
}
.btn--dark:hover { box-shadow: 0 16px 28px rgba(16, 36, 27, 0.24); }
.panel { padding: clamp(18px, 2.8vw, 36px); }
.figure {
  margin: 0;
  border-radius: clamp(18px, 2vw, 28px);
  overflow: hidden;
  background: var(--panel-strong);
  border: 1px solid rgba(16, 36, 27, 0.08);
  box-shadow: 0 18px 50px rgba(16, 36, 27, 0.08);
}
.figure img { width: 100%; height: auto; }
.caption {
  margin-top: 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  justify-content: space-between;
  color: var(--ink-soft);
  font-size: 0.9rem;
}
.caption strong { color: var(--forest); }
@media (max-width: 720px) {
  .page { padding: 0; }
  .window {
    min-height: 100vh;
    border-radius: 0;
    border-left: 0;
    border-right: 0;
  }
  .header { flex-direction: column; }
  .actions { justify-content: flex-start; }
  .panel { padding-top: 14px; }
  .caption { font-size: 0.85rem; }
}
</style>
</head>
<body>
  <div class="page">
    <article class="window">
      <header class="header">
        <div>
          <div class="kicker">AMSI Supplement</div>
          <h1>AMSI Reference</h1>
          <p class="lead">Open the reference image in a popup window or as a normal page.</p>
        </div>
        <div class="actions">
          <a class="btn btn--ghost" href="index.html">Back to LP</a>
          <button class="btn btn--dark" id="closeBtn" type="button">Close</button>
        </div>
      </header>
      <div class="panel">
        <figure class="figure">
          <img src="assets/amsi-supplement.png" alt="AMSI reference sheet" />
        </figure>
        <div class="caption">
          <span><strong>Display:</strong> works as a popup or a standalone page.</span>
          <span><strong>Use:</strong> supplemental LP material and shareable reference</span>
        </div>
      </div>
    </article>
  </div>
<script>
  const closeBtn = document.getElementById('closeBtn');
  closeBtn.addEventListener('click', () => {
    window.close();
    if (!window.closed) {
      if (history.length > 1) {
        history.back();
      } else {
        location.href = 'index.html';
      }
    }
  });
</script>
</body>
</html>
